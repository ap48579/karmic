[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karmic"
version = "0.3.0"
description = "Karmic AI: agents that learn from the consequences of their own actions -- Cortex memory, benchmark-gated self-improvement, and reusable agent roles"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Akhilesh Paspureddi" }]

# Lower bounds, not the exact pins in requirements.txt (that file is a full
# resolved-environment freeze for this repo's own dev venv, not a dependency
# spec for consumers -- see docs/01_harness_spec.md and the "publishing as a
# general package" design notes). Only two upper-bound constraints are kept
# explicit, and only because they're genuinely load-bearing:
#   - numpy<2.5.0: the vendored GPT Researcher tree (agents/research/gpt_researcher/,
#     not a pip dependency, so nothing else declares this for us) requires it. Kept in
#     core, not [research], since numpy is a core dependency anyway (cortex/replay.py).
#   - packaging<26.0.0 is NOT listed here on purpose: langchain-core already
#     declares that constraint itself, so pip's resolver enforces it
#     automatically without us re-asserting it and risking a stricter bound
#     than langchain-core's own.
dependencies = [
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "networkx>=3.6.1",
    "numpy>=2.0.0,<2.5.0",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
# Core (above) = karmic.cortex + karmic.rsi + karmic.agents.general, enough to drive any role
# against a local Ollama model (karmic.agents.general.ollama_json / karmic.rsi.ollama_json_call). The vendored GPT Researcher
# tree and the coding pipeline's Claude client are opt-in, so a consumer that only wants
# Cortex or an archetype doesn't pull in the LangChain stack (docs/09 S10).
claude = ["anthropic>=0.112.0"]
research = [
    "aiofiles>=24.1.0",
    "arxiv>=2.1.3",
    "beautifulsoup4>=4.13.3",
    "colorama>=0.4.6",
    "ddgs>=9.16.1",
    "json-repair>=0.30.3",
    "langchain>=1.0.3",
    "langchain-classic>=1.0.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.0.4",
    "langchain-openai>=1.0.2",
    "langchain-text-splitters>=1.0.0",
    "lxml>=6.1.3",
    "markdown>=3.7",
    "primp>=2.0.1",
    "requests>=2.32.5",
    "tiktoken>=0.14.0",
]
all = ["karmic[claude,research]"]

[project.urls]
Homepage = "https://github.com/ap48579/karmic"

[tool.setuptools.packages.find]
include = ["karmic*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"karmic.agents.general" = ["templates/*.py", "templates/prompts/*.md"]
# The vendored tree's Apache-2.0 license and provenance must ship with it, and the
# browser scraper reads overlay.js from disk at runtime.
"karmic.agents.research" = ["gpt_researcher_LICENSE", "VENDOR.md", "gpt_researcher/scraper/browser/js/*.js"]
